[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "prague"
metadata = true
metadata_hash = "none"
use_literal_content = true
eth-rpc-url = "https://rpc.monad.xyz"
chain_id = 143

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
monad_mainnet = "https://rpc.monad.xyz"
monad_testnet = "${MONAD_TESTNET_RPC_URL}"

[etherscan]
monad_mainnet = { key = "${ETHERSCAN_API_KEY}", url = "${MONAD_EXPLORER_URL}" }
monad_testnet = { key = "${ETHERSCAN_API_KEY}", url = "${MONAD_EXPLORER_URL}" }
