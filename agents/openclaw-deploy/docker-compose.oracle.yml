# GoalNad Oracle — Docker Compose
# Deploy this BEFORE the house agents.
# Usage: docker compose -f docker-compose.oracle.yml up -d

version: "3.8"

services:
  goalnad-oracle:
    image: ghcr.io/phioranex/openclaw-docker:latest
    container_name: goalnad-oracle
    env_file:
      - .env.oracle
    environment:
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - MOLTBOOK_API_KEY=${MOLTBOOK_API_KEY}
      - ORACLE_WALLET=${ORACLE_WALLET}
      - ORACLE_PRIVATE_KEY=${ORACLE_PRIVATE_KEY}
      - GOALNAD_API_URL=${GOALNAD_API_URL}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - MONAD_RPC_URL=${MONAD_RPC_URL}
    volumes:
      - ../openclaw-skills/goalnad-oracle:/home/user/.openclaw/skills/goalnad-oracle:ro
      - ./oracle-data:/home/user/.openclaw/data
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
