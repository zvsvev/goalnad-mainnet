# GoalNad House Agents — Docker Compose (8 Agents)
# Deploy AFTER the Oracle is running.
# Usage: docker compose up -d

version: "3.8"

services:
  openclaw-marcus:
    image: ghcr.io/phioranex/openclaw-docker:latest
    container_name: goalnad-marcus
    environment:
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - AGENT_NAME=${AGENT_MARCUS_NAME:-Marcus_GN}
      - AGENT_WALLET=${AGENT_MARCUS_WALLET}
      - GOALNAD_API_URL=${GOALNAD_API_URL}
    volumes:
      - ../openclaw-skills/goalnad-agent:/home/user/.openclaw/skills/goalnad-agent:ro
      - ../openclaw-skills/personas/marcus:/home/user/.openclaw/skills/goalnad-persona:ro
      - ./agent-data/marcus:/home/user/.openclaw/data
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  openclaw-jake:
