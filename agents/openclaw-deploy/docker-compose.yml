# GoalNad House Agents — Docker Compose (4 Agents)
# Deploy AFTER the Oracle is running.
# Usage: docker compose up -d

version: "3.8"

services:
  openclaw-mark:
    image: ghcr.io/phioranex/openclaw-docker:latest
    container_name: goalnad-mark
    environment:
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - AGENT_NAME=${AGENT_MARK_NAME:-Mark_GN}
      - AGENT_WALLET=${AGENT_MARK_WALLET}
      - GOALNAD_API_URL=${GOALNAD_API_URL}
    volumes:
      - ../openclaw-skills/goalnad-agent:/home/user/.openclaw/skills/goalnad-agent:ro
      - ../openclaw-skills/personas/mark:/home/user/.openclaw/skills/goalnad-persona:ro
      - ./agent-data/mark:/home/user/.openclaw/data
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  openclaw-jake:
    image: ghcr.io/phioranex/openclaw-docker:latest
    container_name: goalnad-jake
    environment:
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - AGENT_NAME=${AGENT_JAKE_NAME:-Jake_GN}
      - AGENT_WALLET=${AGENT_JAKE_WALLET}
      - GOALNAD_API_URL=${GOALNAD_API_URL}
    volumes:
      - ../openclaw-skills/goalnad-agent:/home/user/.openclaw/skills/goalnad-agent:ro
      - ../openclaw-skills/personas/jake:/home/user/.openclaw/skills/goalnad-persona:ro
      - ./agent-data/jake:/home/user/.openclaw/data
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  openclaw-andrew:
    image: ghcr.io/phioranex/openclaw-docker:latest
    container_name: goalnad-andrew
    environment:
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - AGENT_NAME=${AGENT_ANDREW_NAME:-Andrew_GN}
      - AGENT_WALLET=${AGENT_ANDREW_WALLET}
      - GOALNAD_API_URL=${GOALNAD_API_URL}
    volumes:
      - ../openclaw-skills/goalnad-agent:/home/user/.openclaw/skills/goalnad-agent:ro
      - ../openclaw-skills/personas/andrew:/home/user/.openclaw/skills/goalnad-persona:ro
      - ./agent-data/andrew:/home/user/.openclaw/data
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  openclaw-zoe:
    image: ghcr.io/phioranex/openclaw-docker:latest
    container_name: goalnad-zoe
    environment:
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - AGENT_NAME=${AGENT_ZOE_NAME:-Zoe_GN}
      - AGENT_WALLET=${AGENT_ZOE_WALLET}
      - GOALNAD_API_URL=${GOALNAD_API_URL}
    volumes:
      - ../openclaw-skills/goalnad-agent:/home/user/.openclaw/skills/goalnad-agent:ro
      - ../openclaw-skills/personas/zoe:/home/user/.openclaw/skills/goalnad-persona:ro
      - ./agent-data/zoe:/home/user/.openclaw/data
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
